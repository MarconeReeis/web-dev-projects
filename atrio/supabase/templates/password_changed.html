<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sua senha foi alterada</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e4e4e7;border-radius:16px;">
            <tr>
              <td style="padding:32px 32px 0;font-size:14px;font-weight:700;color:#71717a;">
                Aviso de segurança
              </td>
            </tr>
            <tr>
              <td style="padding:12px 32px 0;">
                <h1 style="margin:0;font-size:22px;line-height:1.3;font-weight:700;">Sua senha foi alterada</h1>
                <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#3f3f46;">
                  A senha da conta {{ .Email }} acabou de ser alterada.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 32px;font-size:13px;line-height:1.6;color:#71717a;">
                Se foi você, não precisa fazer nada. Se não foi, use "Esqueci minha senha" no app para criar uma nova agora mesmo.
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#a1a1aa;">E-mail automático. Por favor, não responda.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
